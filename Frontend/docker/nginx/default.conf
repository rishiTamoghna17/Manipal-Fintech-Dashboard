server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS first, public resolver as fallback (upstream API is external).
    resolver 127.0.0.11 8.8.8.8 ipv6=off valid=30s;
    set $manipal_api https://devmanipal.getafixtechnologies.com;

    # Same-origin proxy to the Manipal API — mirrors the Vercel /api-proxy rewrite
    # so the browser never makes a cross-origin request.
    location ^~ /api-proxy/ {
        rewrite ^/api-proxy/(.*)$ /api/$1 break;
        proxy_pass $manipal_api;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host devmanipal.getafixtechnologies.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }

    # Hashed build assets — long cache, no SPA fallback.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
